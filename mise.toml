# Toolchain versions for curlui — the single source of truth for local dev and
# CI (https://mise.jdx.dev). Run `mise install` once, then `mise run check`.
[tools]
go = "1.27.3"
node = "26.12.1"
"npm:pnpm" = "12.15.0"

[tasks.build]
description = "Build both frontends and both binaries"
run = "bash scripts/build.sh"

[tasks.check]
description = "Run every quality gate (vet, tests, tsc, i18n, features, build, size)"
run = "bash scripts/check.sh"

[tasks.e2e]
description = "Run the end-to-end suite against the full build"
run = "cd e2e && pnpm install --frozen-lockfile && node run.mjs"

[tasks."e2e:core"]
description = "Run the end-to-end suite against the core build"
run = "cd e2e && pnpm install --frozen-lockfile && CURLUI_BIN=../server/curlui-server-core CURLUI_PORT=8092 node run.mjs"

[tasks.dev]
description = "Start the Vite dev server against a local curlui"
run = "bash scripts/dev.sh"
