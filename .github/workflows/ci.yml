name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Go and Node versions declared in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Quality gates (vet, tests, tsc, i18n, features, build, size)
        env:
          GOMAXPROCS: "2"
        run: bash scripts/check.sh

      - name: Install Playwright chromium
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm dlx playwright@latest install --with-deps chromium

      - name: E2E (full build)
        working-directory: e2e
        run: node run.mjs

      - name: E2E (core build)
        working-directory: e2e
        env:
          CURLUI_BIN: ../server/curlui-server-core
          CURLUI_PORT: "8092"
        run: node run.mjs
