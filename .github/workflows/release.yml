name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Go and Node versions declared in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Build frontend (full)
        working-directory: web
        run: |
          npm ci || npm install
          CURLUI_DIST=dist npm run build

      - name: Build frontend (core, no pdf.js)
        working-directory: web
        run: CURLUI_PDF=0 CURLUI_DIST=dist-core npm run build

      - name: Embed frontends into the server
        run: |
          rm -rf server/internal/webui/dist server/internal/webui/dist_core
          mkdir -p server/internal/webui/dist server/internal/webui/dist_core
          cp -r web/dist/. server/internal/webui/dist/
          cp -r web/dist-core/. server/internal/webui/dist_core/

      - name: Cross-compile single-file binaries
        working-directory: server
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p ../dist
          build() {
            os=$1; arch=$2; variant=$3; tags=$4; name=$5
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            out="../dist/${name}_${VERSION}_${os}_${arch}${ext}"
            echo "building $out ($variant)"
            GOOS=$os GOARCH=$arch go build \
              -trimpath $tags \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" .
          }
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              build "$os" "$arch" full "" curlui
              build "$os" "$arch" core "-tags core" curlui-core
            done
          done
          cd ../dist
          for f in curlui*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" ;;
              *) tar -czf "${f}.tar.gz" "$f" ;;
            esac
          done
          ls -lh

      - name: Checksums
        working-directory: dist
        run: sha256sum curlui* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
