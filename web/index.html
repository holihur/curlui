<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>curlui — HTTP client</title>
    <script>
      // Apply persisted theme + language before paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem("curlui.theme");
          if (theme !== "light" && theme !== "dark") theme = "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          var locale = localStorage.getItem("curlui.locale");
          if (locale === "en" || locale === "zh") document.documentElement.lang = locale;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
